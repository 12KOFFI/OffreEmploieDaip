security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard_redirect
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 semaine

    # Hierarchie de roles DAIP :
    # - ROLE_DAIP_ADMIN : gestion des comptes DAIP + tous les droits DAIP
    # - ROLE_DAIP : consultation / actions métier DAIP (offres, entreprises, journal)
    # ROLE_ENTREPRISE reste totalement séparé.

    role_hierarchy:
        ROLE_DAIP_ADMIN: [ROLE_DAIP]

    access_control:
        - { path: ^/daip/comptes, roles: ROLE_DAIP }
        - { path: ^/daip, roles: ROLE_DAIP }
        - { path: ^/entreprise, roles: ROLE_ENTREPRISE }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10