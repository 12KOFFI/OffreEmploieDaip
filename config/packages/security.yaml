security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 semaine

    # Pas de hierarchie de roles ici, volontairement : ROLE_ENTREPRISE et
    # ROLE_DAIP sont deux perimetres totalement etanches. La DAIP a son
    # propre espace, mais en LECTURE SEULE (consultation de toutes les
    # offres) : jamais les routes de creation/edition/changement de statut
    # d'une offre, qui restent reservees a ROLE_ENTREPRISE sur ses propres
    # offres uniquement.

    access_control:
        - { path: ^/daip, roles: ROLE_DAIP }
        - { path: ^/entreprise, roles: ROLE_ENTREPRISE }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
